services:
  node-gateway:
    build: ./node-gateway
    ports:
      - "3000:3000"
    environment:
      - PYTHON_SERVICE_URL=http://python-service:8000
      - REDIS_URL=redis://redis:6379
      - GATEWAY_API_KEY=${GATEWAY_API_KEY}
    depends_on:
      - python-service
      - redis

  python-service:
    build: ./python-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./python-service/corpus:/app/corpus:ro
      - ./python-service/.chroma:/app/.chroma

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
