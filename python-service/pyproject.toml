[project]
name = "rag-python-service"
version = "0.1.0"
description = "Python inference service for the RAG portfolio project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "voyageai>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
